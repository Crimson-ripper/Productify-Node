<!doctype html><html lang="en" class="notranslate"><head><meta charset="UTF-8"/><meta name="google" content="notranslate"/><title>Moonlight</title><link rel="icon" href="resources/moonlight.svg" sizes="any" type="image/svg+xml"><script src="./config.js"></script><script>try {
            const raw = localStorage.getItem("mlSettings");
            const parsed = raw ? JSON.parse(raw) : null;
