[package]
name = "productify-node"
version = "2.1.0"
description = "Productify Node — rent out your GPU on productifynow.com"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
